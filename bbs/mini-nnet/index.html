<!DOCTYPE html>
<html>
<head>
  <title>Mini Neural Net</title>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000008'/><text y='.9em' font-size='90' fill='%2300ffff'>✲</text></svg>">
  <link rel="stylesheet" href="../../resources/css/style.css">
  <script src="../../resources/js/main.js" defer></script>
  <style>

    .panel {
      display: inline-block;
      text-align: left;
    }


    #goBtn {
      background: transparent;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: 'Share Tech Mono', Consolas, 'Lucida Console', monospace;
      font-size: 12px;
      padding: 4px 14px;
      cursor: pointer;
      border-radius: 2px;
      opacity: 0.75;
      transition: background 0.15s, color 0.15s;
      min-width: 76px;
      min-height: 26px;
      vertical-align: middle;
    }

    #goBtn:hover {
      background: #00ffff;
      color: #000008;
      opacity: 1;
    }

    #log {
      width: 809px;
      height: 60px;
      margin-top: 8px;
      font-size: 11px;
      font-family: 'Share Tech Mono', Consolas, 'Lucida Console', monospace;
      color: #008080;
      background-color: #000008;
      border: solid 1px #004444;
      display: block;
      scrollbar-width: none;
      -ms-overflow-style: none;     
      &::-webkit-scrollbar { display: none; }  
    }    

    .grid-container {
      display: grid;
      grid-template-columns: repeat(18, 40px);
      grid-template-rows: repeat(15, 40px);
      gap: 5px;
      background-color: #333;
      padding: 5px;
      border-radius: 3px;
    }

    .grid-cell {
      background-color: #808080;
      display: flex;
      padding: 2px;
      font-size: 8px;
      font-weight: normal;
      color: #555;
      user-select: none;
      transition: font-weight 0.2s;
      border-radius: 3px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .grid-cell:hover {
      font-weight: bold;
    }    



    /*-- controls --*/
    .controls {
      display: flex;
      gap: 8px;
      margin: auto;
      width: 814px;
      margin-bottom: 10px;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: 'Share Tech Mono', Consolas, 'Lucida Console', monospace;
      font-size: 12px;
      padding: 3px 12px;
      cursor: pointer;
      border-radius: 2px;
      opacity: 0.75;
      transition: background 0.12s, color 0.12s;
      min-width: 76px;
      text-align: center;
    }

    .ctrl-btn:hover {
      background: #00ffff;
      color: #000008;
      opacity: 1;
    }

    .ctrl-btn.danger {
      border-color: #ff5555;
      color: #ff5555;
    }

    .ctrl-btn.danger:hover {
      background: #ff5555;
      color: #000008;
    }


    .palette-select {
      background: black;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: 'Share Tech Mono', Consolas, 'Lucida Console', monospace;
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 2px;
      opacity: 0.75;
      transition: opacity 0.12s
    }

    .palette-select:hover {
      opacity: 1;
    }    

  </style>
</head>
<body>
  <p><br /></p>
  <div class="back-link"><a href="../../">← back to earthgateway.com</a></div>
  <div class="title-bar">🖧 MINI NNET</div>

  <!-- controls -->
  <div class="controls">
    <button class="ctrl-btn" onclick="adjustSteepness(false);" id="btnDown">[<b>-</b>] Steepness ↓</button>
    <button class="ctrl-btn" onclick="adjustSteepness(true);"  id="btnUp">[<b>+</b>] Steepness ↑</button>

    <select class="palette-select" id="paletteSelect" onchange="setPalette(this.value);">
      <option value="Cyan" selected>Cyan</option>
      <option value="Green">Green</option>
      <option value="Gray">Gray</option>
      <option value="Red">Red</option>
      <option value="Blue">Blue</option>
      <option value="Yellow">Yellow</option>
    </select>
  </div>

  <div class="panel">

    <div id="nnet_map" class="grid-container"></div>

    <textarea id="log" readonly spellcheck="false"></textarea>

  </div>

  <p><br /></p>
  <script type="text/javascript">

    let columns   = 18;
    let rows      = 15;
    let steepness = 0.007;

    const writeLog = (entry) => {
      self.log.value     += `>${entry}\n`;
      self.log.scrollTop  = self.log.scrollHeight;
    };
    
    writeLog('loading...');

    let propagationFrameRequested = false;

    const COLOR_SCHEME_GRAY   = "Gray";
    const COLOR_SCHEME_GREEN  = "Green";
    const COLOR_SCHEME_RED    = "Red";
    const COLOR_SCHEME_BLUE   = "Blue";
    const COLOR_SCHEME_CYAN   = "Cyan";
    const COLOR_SCHEME_YELLOW = "Yellow";

    let palette = COLOR_SCHEME_CYAN;

    const getColorForValue = (decimalColorValue) =>
    {
      if (!Number.isSafeInteger(decimalColorValue)) return '#808080';

      const hexValue  = `00${decimalColorValue.toString(16)}`.slice(-2);
      const darkValue = '00';

      switch (palette)
      {
        case COLOR_SCHEME_GREEN:
        {
          return `#${darkValue}${hexValue}${darkValue}`;
        }

        case COLOR_SCHEME_RED:
        {
          return `#${hexValue}${darkValue}${darkValue}`;
        }

        case COLOR_SCHEME_BLUE:
        {
          return `#${darkValue}${darkValue}${hexValue}`;
        }

        case COLOR_SCHEME_CYAN:
        {
          return `#${darkValue}${hexValue}${hexValue}`;
        }

        case COLOR_SCHEME_YELLOW:
        {
          return `#${hexValue}${hexValue}${darkValue}`;
        }

        case COLOR_SCHEME_GRAY:
        default:
          return `#${hexValue}${hexValue}${hexValue}`;
      }
    };

    const repaintGrid = () =>
    {
      for (let rowIndex = 0; rowIndex < rows; rowIndex++)
      {
        for (let columnIndex = 0; columnIndex < columns; columnIndex++)
        {
          const thisCell = document.getElementById(`cell-${columnIndex}-${rowIndex}`);

          if (!thisCell) continue;

          const colorValue = parseInt(thisCell.dataset.colorValue);

          thisCell.style.backgroundColor = getColorForValue(colorValue);
        }
      }
    };

    const setPalette = (newPalette) =>
    {
      palette = newPalette;

      writeLog(`palette set to ${newPalette}`);

      repaintGrid();
    };

    const adjustSteepness = (adjustUp) => {
      steepness = (steepness * (adjustUp ? 1.1 : 0.9));
      writeLog(`sigmoid steepness set to ${steepness.toFixed(5)}`);
      scheduleColumnPropagation(0);
    };

    const scheduleColumnPropagation = (startColumnIndex) => {
      if (propagationFrameRequested) return;

      propagationFrameRequested = true;

      requestAnimationFrame(() =>
      {
        propagationFrameRequested = false;
        propagateColumn(startColumnIndex);
      });
    };   
 
    const getCellValue = (columnIndex, rowIndex) =>
    {
      const wrappedRowIndex = (rowIndex + rows) % rows;
      const targetCell      = document.getElementById(`cell-${columnIndex}-${wrappedRowIndex}`);

      if (!targetCell) return null;

      return parseInt(targetCell.dataset.colorValue);
    };    

    const sigmoidActivation = (rawSum) => {
      const midpoint  = 128;
      

      return 255 / (1 + Math.exp(-steepness * (rawSum - midpoint)));
    };

    const calculateNodeValue = (valueAbove, valueLevel, valueBelow, weightAbove, weightLevel, weightBelow) => {
      const weightedSum = (valueAbove * weightAbove) + (valueLevel * weightLevel) + (valueBelow * weightBelow);
      const activated   = sigmoidActivation(weightedSum);

      return Math.round(activated);
    };

    const propagateColumn = (startColumnIndex) =>
    {
      const nextColumnIndex = startColumnIndex + 1;

      if (nextColumnIndex >= columns) return;

      for (let rowIndex = 0; rowIndex < rows; rowIndex++)
      {
        const thisCell = document.getElementById(`cell-${nextColumnIndex}-${rowIndex}`);

        const valueAbove = getCellValue(startColumnIndex, rowIndex - 1);
        const valueLevel = getCellValue(startColumnIndex, rowIndex);
        const valueBelow = getCellValue(startColumnIndex, rowIndex + 1);

        const weightAbove = thisCell.dataset.weightAbove;
        const weightLevel = thisCell.dataset.weightLevel;
        const weightBelow = thisCell.dataset.weightBelow;

        const neoColorValue = calculateNodeValue(
          valueAbove,
          valueLevel,
          valueBelow,
          weightAbove,
          weightLevel,
          weightBelow
        );

        const hexValue        = `00${neoColorValue.toString(16)}`.slice(-2);
        const textColor       = neoColorValue > 127 ? '#000000' : '#FFFFFF';
        const backgroundColor = getColorForValue(neoColorValue);

        thisCell.innerHTML             = `(${nextColumnIndex}, ${rowIndex})<br>${hexValue.toUpperCase()}`;
        thisCell.title                 = `Cell (${nextColumnIndex}, ${rowIndex}) value of ${neoColorValue} with weights {${weightAbove}, ${weightLevel}, ${weightBelow}}`;
        thisCell.dataset.colorValue    = neoColorValue;
        thisCell.style.backgroundColor = backgroundColor;
        thisCell.style.color           = textColor;
      }

      scheduleColumnPropagation(nextColumnIndex);
    }; 

    const loadGrid = (container, columns, rows) => {
      if (!container) return false;
      if (!(Number.isInteger(columns) && columns > 0)) return false;
      if (!(Number.isInteger(rows)    && rows    > 0)) return false;

      for (let rowIndex = 0; rowIndex < rows; rowIndex++) {
        for (let columnIndex = 0; columnIndex < columns; columnIndex++) {
          let cell = document.createElement('div');

          const initialColorValue      = columnIndex === 0 ? Math.floor(Math.random() * 256) : 128;
          const initialHexValue        = `00${initialColorValue.toString(16)}`.slice(-2);
          const initialBackgroundColor = getColorForValue(initialColorValue);

          cell.id                    = `cell-${columnIndex}-${rowIndex}`;
          cell.className             = 'grid-cell';
          cell.innerHTML             = `(${columnIndex}, ${rowIndex})<br>${initialHexValue.toUpperCase()}`;
          cell.title                 = `Cell (${columnIndex}, ${rowIndex}) value of ${initialColorValue}`;
          cell.dataset.columnIndex   = `${columnIndex}`;
          cell.dataset.rowIndex      = `${rowIndex}`;
          cell.dataset.colorValue    = `${initialColorValue}`;
          cell.style.backgroundColor = initialBackgroundColor;
          cell.style.color           = initialColorValue > 127 ? '#000000' : '#FFFFFF';

          if(columnIndex > 0) {
            let weightAbove = Math.random().toFixed(3);
            let weightLevel = Math.random().toFixed(3);
            let weightBelow = Math.random().toFixed(3);            

            cell.dataset.weightAbove = weightAbove;
            cell.dataset.weightLevel = weightLevel;
            cell.dataset.weightBelow = weightBelow;
            cell.title               = `Cell (${columnIndex}, ${rowIndex}) value of 128 with weights {${weightAbove}, ${weightLevel}, ${weightBelow}}`;
          };

          if(columnIndex === 0) {
            cell.addEventListener(
              'wheel',
              (wheelEvent) =>
              {
                wheelEvent.preventDefault();

                const deltaMultiplier = wheelEvent.deltaMode === 1 ? 15 : (wheelEvent.deltaMode === 2 ? 400 : 1);
                const normalizedDeltaY = wheelEvent.deltaY * deltaMultiplier;

                const thisCell        = wheelEvent.target;
                const colorValue      = parseInt(thisCell.dataset.colorValue);
                const neoColorValue   = Math.min(255, Math.max(0, parseInt(colorValue - (normalizedDeltaY * 0.125))));
                const hexValue         = `00${neoColorValue.toString(16)}`.slice(-2);
                const textColor        = neoColorValue > 127 ? '#000000' : '#FFFFFF';
                const backgroundColor  = getColorForValue(neoColorValue);
                const cellColumnIndex = thisCell.dataset.columnIndex;
                const cellRowIndex    = thisCell.dataset.rowIndex;

                thisCell.innerHTML             = `(${cellColumnIndex}, ${cellRowIndex})<br>${hexValue.toUpperCase()}`;
                thisCell.title                 = `Cell (${cellColumnIndex}, ${cellRowIndex}) value of ${neoColorValue}`;
                thisCell.dataset.colorValue    = neoColorValue;
                thisCell.style.backgroundColor = backgroundColor;
                thisCell.style.color           = textColor;

                scheduleColumnPropagation(columnIndex);
              },
              { passive: false }
            );           
          };


          container.appendChild(cell);

          cell = null;
        }
      }
    };

    let ms = (new Date()).getTime();
    loadGrid(self.nnet_map, columns, rows);
    scheduleColumnPropagation(0);
    ms = (new Date()).getTime() - ms;
    
    writeLog(`grid container populated ${rows * columns} cells in ${ms} ms`);
    writeLog(`sigmoid steepness set to ${steepness.toFixed(5)}`);
    writeLog(`⚠ scroll over column 0 to set input values`);

    self.addEventListener('keydown', (keyDownEvent) => {
      switch (keyDownEvent.key) {
        case '+':
          adjustSteepness(true);
          break;
        case '-':
          adjustSteepness(false);
          break;
      }
    }); 

  </script>
</body>

</html>
