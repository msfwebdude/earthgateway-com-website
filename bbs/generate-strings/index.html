    function generateStrings() {
        self.goBtn.enabled = false;
        self.stringList.value = "";
        var n = self.numberOfStrings.value;
        var c = parseInt(self.numberOfCharacters.value);
        var i = 0;
        var x = 0;
        var d = (new Date()).getTime();

        var stringMethod = self.stringMethod.value;

        switch (stringMethod) {
            case "rnd":
                var allowedCharArray = randomizeArray("abcdefghijklmnopqrstuvwxyz0123456789!#$%ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));
                var l = allowedCharArray.length;

                while (i < n){
                    var string = "";
                    for (let n = 0; n <= c; n++) {
                        var r = Math.floor(Math.random() * l);
                        string += allowedCharArray[r];
                    }
                    
                    self.stringList.value += string + "\n";
                    i++;
                    x++;
                }
                break;

            case "w4w":
                while (i < n) {
                    var tempString = "";
                    var evenOdd = 0;
                    while (tempString.length < c) {
                        if (evenOdd == 0) {
                            evenOdd = 1;
                            tempString += getWord();
                        }
                        else {
                            evenOdd = 0;
                            tempString += Math.random().toString().substr(2, 4);
                        }
                    }
                    if (tempString.length == c) {
                        self.stringList.value += tempString + "\n";
                        i++;
                    }

                    x++;
                }            
                break;
        
            default:
                break;
        }

        d = (new Date()).getTime() - d;
        var r = Math.round((n / x) * 1000) / 10;
        self.log.value += `generated ${n} strings in ${x} attempts (${r}% pass rate). took ${d} ms.\n`;
        self.log.scrollTop = self.log.scrollHeight;
        self.goBtn.enabled = true;
    }

    function getWord() {
        var idx = Math.floor((Math.random() * words.length))
        var wrd = words[idx]
        if (Math.random() > 0.5) {
            wrd = wrd.substr(0, 1).toUpperCase() + wrd.substr(1);
        }
        return wrd
    }

    function randomizeArray(arr) {
        var arrInp = arr;
        var arrOut = [];
        var i;
        for (i = 0; i < 32; i++) {
            arrOut = [];
            arrInp.forEach(
                function (item, index) {
                    if (Math.random() > 0.5) {
                        arrOut.push(item);
                    }
                    else {
                        arrOut.unshift(item);
                    }
                }
            );
            arrInp = arrOut;
        }

        return arrOut;
    }

    function selectWholeLine(obj) {
      const selTxt = obj.value;
      const selStr = obj.selectionStart;
      const selEnd = obj.selectionEnd;
      let lastLE  = 0;
      let nextLE  = selTxt.length;

      for (let i = selStr; i > 0; i--) {
        if (selTxt.substr(i, 1) == "\n") {
          lastLE = i + 1;
          break;
        }
      }

      for (let i = selEnd; i < nextLE; i++) {
        if (selTxt.substr(i, 1) == "\n") {
          nextLE = i;
          break;
        }
      }

      obj.setSelectionRange(lastLE, nextLE);
    }

    var d = (new Date()).getTime();
    words = randomizeArray(words);
    d = (new Date()).getTime() - d;
    self.log.value += `randomized ${words.length} words in ${d} ms.\n`;
    self.log.scrollTop = self.log.scrollHeight;    

    self.stringList.value = "Ready";
