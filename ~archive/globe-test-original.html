<!DOCTYPE html>
<html>
<head>
  <title>Globe Test</title>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #101010;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Share Tech Mono', Consolas, 'Lucida Console', monospace;
    }

    #globe {
      color: #00ffff;
      font-size: 14px;
      line-height: 1.2;
      white-space: pre;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.4);
    }

    #controls {
      margin-top: 20px;
      color: #008080;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    button {
      background: transparent;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: 'Share Tech Mono', Consolas, 'Lucida Console', monospace;
      font-size: 11px;
      padding: 2px 10px;
      cursor: pointer;
      border-radius: 2px;
      margin: 0 4px;
      opacity: 0.75;
      transition: background 0.15s, color 0.15s;
    }

    button:hover {
      background: #00ffff;
      color: #000008;
      opacity: 1;
    }
  </style>
</head>
<body>

  <pre id="globe"></pre>
  <div id="controls">
    <button onclick="slower()">◀ slower</button>
    <button onclick="togglePause()">⏸ pause</button>
    <button onclick="faster()">faster ▶</button>
  </div>

  <script>
    const frames = [
      // frame 0
      [
        "      .-----------.",
        "    /   . .  .  .  \\",
        "   | ---+--+--+---  |",
        "   |  . | .|. | .   |",
        "  /  . .|  |  |.  . \\",
        " | .  . +--+--+  .   |",
        " |   .  |  |  | .  . |",
        "  \\ .  .|  |  |.  . /",
        "   |---+--+--+---    |",
        "    \\   .  .  .  .  /",
        "      '-----------'",
      ],
      // frame 1
      [
        "      .-----------.",
        "    /  .  . .  .   \\",
        "   | --+---+--+---  |",
        "   | .  |. |  | .   |",
        "  /  .  |  |  |.  . \\",
        " | .   .+--+--+.  .  |",
        " |   .  |  |. | .  . |",
        "  \\ .   |  |  |.  . /",
        "   |--+---+--+---    |",
        "    \\  .  . .  .  . /",
        "      '-----------'",
      ],
      // frame 2
      [
        "      .-----------.",
        "    /   .  .  . .  \\",
        "   | -+---+--+--+-  |",
        "   | .|   |. | .|   |",
        "  /  .|   |  | |.   \\",
        " | .  +---+--+--+.   |",
        " |   .|   |  | .|    |",
        "  \\ . |   |  | |.  ./",
        "   |-+---+--+--+-    |",
        "    \\  .  .  . .   /",
        "      '-----------'",
      ],
      // frame 3
      [
        "      .-----------.",
        "    /    .  .  .   \\",
        "   | +--+---+--+--  |",
        "   | |. |   |. |    |",
        "  /  |  |   |  |.   \\",
        " | . +--+---+--+--   |",
        " |   |  |   |  |.    |",
        "  \\ .|  |   |  |.  /",
        "   |+--+---+--+--    |",
        "    \\   .  .  .    /",
        "      '-----------'",
      ],
      // frame 4
      [
        "      .-----------.",
        "    /     .  .  .  \\",
        "   | -+--+---+--+-  |",
        "   |  |  |.  |. |   |",
        "  /   |  |   |  |.  \\",
        " |  . +--+---+--+-.  |",
        " |    |  |   |.  |   |",
        "  \\  .|  |   |  |. /",
        "   |-+--+---+--+-    |",
        "    \\    .  .  .   /",
        "      '-----------'",
      ],
      // frame 5
      [
        "      .-----------.",
        "    /   .   .  .   \\",
        "   |  --+--+---+--  |",
        "   |  . |  |.  |    |",
        "  /   . |  |   |.   \\",
        " |  .  -+--+---+--.  |",
        " |    . |  |.  |     |",
        "  \\   .|  |   |.   /",
        "   | --+--+---+--    |",
        "    \\  .   .  .    /",
        "      '-----------'",
      ],
      // frame 6
      [
        "      .-----------.",
        "    /  .   .   .   \\",
        "   |  -+--+--+---+  |",
        "   |   |  |  |.  |  |",
        "  /  . |  |  |   |. \\",
        " |   . +--+--+---+.  |",
        " |   . |  |  |   |   |",
        "  \\  .|  |  |   |. /",
        "   | -+--+--+---+    |",
        "    \\  .  .   .    /",
        "      '-----------'",
      ],
      // frame 7
      [
        "      .-----------.",
        "    /   .  .   .   \\",
        "   |  +--+--+--+--  |",
        "   |  |  |. |  |    |",
        "  /   |  |  |  |.   \\",
        " |  . +--+--+--+--.  |",
        " |    |  |. |  |     |",
        "  \\  .|  |  |  |.  /",
        "   | +--+--+--+--    |",
        "    \\   .  .   .   /",
        "      '-----------'",
      ],
    ];

    let currentFrame = 0;
    let intervalMs   = 150;
    let paused       = false;
    let timer        = null;

    const globeEl = document.getElementById('globe');

    function renderFrame() {
      globeEl.textContent = frames[currentFrame].join('\n');
      currentFrame = (currentFrame + 1) % frames.length;
    }

    function startTimer() {
      if (timer) clearInterval(timer);
      timer = setInterval(renderFrame, intervalMs);
    }

    function togglePause() {
      const btn = document.querySelector('button:nth-child(2)');
      paused = !paused;
      if (paused) {
        clearInterval(timer);
        btn.textContent = '▶ play';
      }
      else {
        startTimer();
        btn.textContent = '⏸ pause';
      }
    }

    function slower() {
      intervalMs = Math.min(intervalMs + 50, 800);
      if (!paused) startTimer();
    }

    function faster() {
      intervalMs = Math.max(intervalMs - 50, 50);
      if (!paused) startTimer();
    }

    renderFrame();
    startTimer();
  </script>
</body>
</html>
